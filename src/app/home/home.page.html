<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Babel List
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Babel List</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-lista [actualizar]="actualizar" (editar)="openModal($event)"></app-lista>

  <ion-fab slot="fixed" horizontal="end" vertical="bottom">
    <ion-fab-button (click)="openModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
